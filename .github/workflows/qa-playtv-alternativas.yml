name: Probar señales equivalentes a PlayTV sin tokens
on:
  push:
    branches: [feature/alternativas-legales-playtv-20261123]
    paths:
      - 'scripts/qa_playtv_alternativas_20261123.py'
      - '.github/workflows/qa-playtv-alternativas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Preparar FFmpeg
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Dos pasadas de prueba de video HLS
        run: python3 scripts/qa_playtv_alternativas_20261123.py
