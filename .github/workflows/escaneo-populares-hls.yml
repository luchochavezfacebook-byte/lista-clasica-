name: Auditar candidatos populares HLS sin publicar
on:
  push:
    branches:
      - feat/hls-populares-verificados-20261111
    paths:
      - '.github/workflows/escaneo-populares-hls.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verificar FFmpeg
        run: ffmpeg -version | head -2
      - name: Probar manifiesto y decodificación real de cada candidato
        run: python3 scripts/escaneo_populares_hls.py
      - name: Publicar solo reporte privado de la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidatos-populares-hls-20261111
          path: diagnosticos/resultado_populares_20261111.json
          if-no-files-found: error
          retention-days: 7
