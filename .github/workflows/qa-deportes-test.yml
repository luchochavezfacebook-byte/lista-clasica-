name: QA deportes gratuitos — lista temporal
on:
  push:
    branches:
      - qa/deportes-senales-prueba-20261123
    paths:
      - 'scripts/qa_deportes_test.py'
      - '.github/workflows/qa-deportes-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar FFmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Validar imágenes en dos pasadas
        run: python3 scripts/qa_deportes_test.py
