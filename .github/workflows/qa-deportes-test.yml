name: QA deportes gratuitos — lista temporal
on:
  push:
    branches:
      - qa/deportes-senales-prueba-20261123
    paths:
      - 'scripts/qa_deportes_test.py'
      - '.github/workflows/qa-deportes-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar binario FFmpeg autocontenido
        run: |
          python3 -m pip install --disable-pip-version-check --quiet imageio-ffmpeg
          echo "FFMPEG_BINARY=$(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
      - name: Validar imágenes en dos pasadas
        run: python3 scripts/qa_deportes_test.py
