name: Revalidar canales averiados (video real y alternativas)
on:
  push:
    branches:
      - fix/quitar-canales-sin-senal-20261123
    paths:
      - 'scripts/qa_bajas_20261123.py'
      - '.github/workflows/qa-bajas-20261123.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Preparar FFmpeg
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Dos pasadas de reproducción de todos los canales problemáticos y alternativas
        run: python3 scripts/qa_bajas_20261123.py
