name: Auditar TVPlay español 2026 (solo prueba)
on:
  push:
    branches:
      - feature/tvplay-es-hls-20261123
    paths:
      - 'scripts/auditar_tvplay_es_2026.py'
      - '.github/workflows/auditar-tvplay-es.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Instalar y comprobar FFmpeg
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          command -v ffmpeg
          ffmpeg -version
      - name: Probar dos veces fotogramas de video HLS
        run: python3 scripts/auditar_tvplay_es_2026.py
