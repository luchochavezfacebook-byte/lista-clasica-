name: Integrar deportes temporales con QA
on:
  push:
    branches: [feature/deportes-test-20261123]
    paths:
      - 'fuentes_deportes_prueba_20261123.json'
      - 'scripts/generar_lista.py'
      - '.github/workflows/integrar-deportes-test.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrar:
    if: github.ref == 'refs/heads/feature/deportes-test-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar M3U con canales temporales
        run: python3 scripts/generar_lista.py
      - name: Validar que se preservan los 346 originales y aparecen 7 nuevos
        run: |
          python3 scripts/validar_repositorio.py
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          old=subprocess.check_output(['git','show','origin/main:lista_clasica.m3u'],text=True)
          new=Path('lista_clasica.m3u').read_text(encoding='utf-8')
          a={x for x in old.splitlines() if x.startswith(('http://','https://'))}
          b={x for x in new.splitlines() if x.startswith(('http://','https://'))}
          rows=json.loads(Path('fuentes_deportes_prueba_20261123.json').read_text())['canales']
          assert len(a)==346,len(a)
          assert len(b)==353,len(b)
          assert a.issubset(b)
          assert b-a=={x['url'] for x in rows}
          assert len(rows)==7
          assert all(x['nombre'].endswith(' (PRUEBA)') for x in rows)
          assert new.count('#EXTINF:')==353
          assert 'youtube.com/' not in new
          print('OK: 346 HLS existentes + 7 señales deportivas temporales = 353, sin pérdidas')
          PY
      - name: Guardar nueva playlist solo en rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lista_clasica.m3u
          git diff --cached --quiet && exit 0
          git commit -m "build: generar 353 canales con siete deportes de prueba"
          git push origin HEAD:feature/deportes-test-20261123
