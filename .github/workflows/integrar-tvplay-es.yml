name: Integrar TVPlay ES verificados (rama de prueba)
on:
  push:
    branches:
      - feature/tvplay-es-hls-20261123
    paths:
      - 'fuentes_tvplay_es_2026.json'
      - 'scripts/generar_lista.py'
      - '.github/workflows/integrar-tvplay-es.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrar:
    if: github.ref == 'refs/heads/feature/tvplay-es-hls-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerar M3U con las 12 señales aprobadas
        run: python3 scripts/generar_lista.py
      - name: Comprobar cantidades, integridad y ausencia de duplicados
        run: |
          python3 scripts/validar_repositorio.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          added=json.loads(Path('fuentes_tvplay_es_2026.json').read_text())['canales']
          assert len(added)==12, 'Faltan señales verificadas'
          original=Path('lista_clasica.m3u').read_text()
          assert original.count('#EXTINF:')==364, 'No hay exactamente 364 canales'
          assert all(("\n"+ch["url"]+"\n") in original for ch in added), 'Falta una señal aprobada'
          for ch in added:
              assert ch["url"].startswith('https://') and ch["url"].split('?',1)[0].endswith('.m3u8')
          print('OK: 352 señales originales preservadas + 12 nuevas TVPlay ES')
          PY
      - name: Guardar M3U regenerado en esta rama (sin publicar todavía)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lista_clasica.m3u
          git diff --cached --quiet && exit 0
          git commit -m "build: regenerar Lista Clásica con 12 señales TVPlay verificadas"
          git push origin HEAD:feature/tvplay-es-hls-20261123
