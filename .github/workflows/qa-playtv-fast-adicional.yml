name: QA adicional Telemundo y deportes FAST sin tokens
on:
  push:
    branches: [feature/alternativas-legales-playtv-20261123]
    paths:
      - 'scripts/qa_playtv_fast_adicional_20261123.py'
      - '.github/workflows/qa-playtv-fast-adicional.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preparar FFmpeg
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Dos pasadas video de alternativas FAST oficiales
        run: python3 scripts/qa_playtv_fast_adicional_20261123.py
