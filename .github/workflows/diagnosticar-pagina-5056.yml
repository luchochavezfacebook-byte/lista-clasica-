name: Diagnóstico HTTP público IP 200.80.230.125
on:
  push:
    branches:
      - diagnostico/ip-200-80-230-125-5056-20261122
    paths:
      - 'scripts/diagnosticar_pagina_5056.py'
      - '.github/workflows/diagnosticar-pagina-5056.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar FFmpeg para probar decodificación
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Verificar respuesta HTTP y estructura visible sin autenticación
        run: python3 scripts/diagnosticar_pagina_5056.py
